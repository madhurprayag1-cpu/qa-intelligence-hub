services:
  - type: web
    name: qa-intelligence-hub-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "sh backend/render_start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qa-intelligence-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: QA_DOMAIN
        value: airline

databases:
  - name: qa-intelligence-db
    databaseName: qa_intelligence
    plan: free
