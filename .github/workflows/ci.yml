name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_intelligence
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run Alembic migrations and seed data
        env:
          DATABASE_URL: postgresql+psycopg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/qa_intelligence
        run: |
          cd backend
          alembic upgrade head
          python -m app.db.seed
          python -m app.db.seed_airports
          python -m app.db.seed_flights
      - name: Run Pytest test suite with JUnit XML
        env:
          DATABASE_URL: postgresql+psycopg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/qa_intelligence
          PYTHONPATH: backend:qa-engine:ai-engine
        run: |
          mkdir -p test-results
          python -m pytest -v --junitxml=test-results/pytest-report.xml

      - name: Run Automated DAST Security Scan
        env:
          PYTHONPATH: backend:qa-engine:ai-engine
        run: |
          python qa-engine/security_scanner.py --mode gate --output-json test-results/security-dast-report.json

      - name: Evaluate Release Quality Gate
        env:
          PYTHONPATH: backend:qa-engine:ai-engine
        run: |
          python qa-engine/cli_gate.py \
            --policy PRODUCTION_STRICT \
            --junit-xml test-results/pytest-report.xml \
            --security-json test-results/security-dast-report.json \
            --output-markdown test-results/quality-gate-summary.md
          cat test-results/quality-gate-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload backend checkpoint evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ci-evidence-backend
          path: test-results/
          if-no-files-found: warn
          retention-days: 14



  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint
      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend build evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ci-evidence-frontend
          path: frontend/dist/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_intelligence
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies & run migrations
        env:
          DATABASE_URL: postgresql+psycopg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/qa_intelligence
        run: |
          pip install -r backend/requirements.txt
          cd backend
          alembic upgrade head
          python -m app.db.seed
          python -m app.db.seed_airports
          python -m app.db.seed_flights
          python -m app.db.seed_fintech_e2e --e2e
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Install Playwright and browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E Suite
        env:
          DATABASE_URL: postgresql+psycopg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/qa_intelligence
        run: npm run test:e2e

      - name: Evaluate E2E Release Quality Gate
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: backend:qa-engine:ai-engine
        run: |
          python qa-engine/cli_gate.py \
            --policy PRODUCTION_STRICT \
            --playwright-json test-results/playwright-report.json \
            --output-markdown test-results/e2e-quality-gate-summary.md || GATE_EXIT=$?
          if [ -f test-results/e2e-quality-gate-summary.md ]; then
            cat test-results/e2e-quality-gate-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          exit ${GATE_EXIT:-0}

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ci-evidence-e2e
          path: test-results/
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install static analysis and dependency audit tools
        run: python -m pip install --upgrade bandit pip-audit
      - name: Python SAST
        run: bandit -r backend/app api -ll -ii
      - name: Python dependency vulnerability audit
        run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend dependency vulnerability audit
        run: npm audit --prefix frontend --audit-level=high
      - name: Install pinned Gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Secret scanning
        run: /tmp/gitleaks detect --source . --redact --exit-code=2 --no-banner

  checkpoint:
    if: ${{ always() }}
    needs: [backend, frontend, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-evidence-backend
          path: ${{ runner.temp }}/ci-evidence/backend
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-evidence-e2e
          path: ${{ runner.temp }}/ci-evidence/e2e
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-evidence-frontend
          path: ${{ runner.temp }}/ci-evidence/frontend/dist
      - name: Validate revision-bound CI evidence and roadmap checkpoint
        env:
          CI_REVISION: ${{ github.sha }}
          CI_BACKEND_RESULT: ${{ needs.backend.result }}
          CI_FRONTEND_RESULT: ${{ needs.frontend.result }}
          CI_E2E_RESULT: ${{ needs.e2e.result }}
          CI_SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$CI_SECURITY_RESULT" = "success"
          test -z "$(git status --porcelain)"
          python qa-engine/task_checkpoint.py \
            --ci-evidence-dir "$RUNNER_TEMP/ci-evidence" \
            --revision "$CI_REVISION" \
            --job-results "backend=$CI_BACKEND_RESULT,frontend=$CI_FRONTEND_RESULT,e2e=$CI_E2E_RESULT,security=$CI_SECURITY_RESULT" \
            --ci-worktree-clean
